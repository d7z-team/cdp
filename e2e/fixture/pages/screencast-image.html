<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screencast Image</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

  .tile {
      width: 100%;
      height: 100%;
    }

    .ticker {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 999px;
      background: rgb(255 255 255);
      opacity: 0.15;
      pointer-events: none;
    }

    [data-testid="tile-red"] {
      background: rgb(255 0 0);
    }

    [data-testid="tile-green"] {
      background: rgb(0 255 0);
    }

    [data-testid="tile-blue"] {
      background: rgb(0 0 255);
    }

    [data-testid="tile-yellow"] {
      background: rgb(255 255 0);
    }
  </style>
</head>
<body>
<div class="tile" data-testid="tile-red"></div>
<div class="tile" data-testid="tile-green"></div>
<div class="tile" data-testid="tile-blue"></div>
<div class="tile" data-testid="tile-yellow"></div>
<div class="ticker" id="ticker" aria-hidden="true"></div>
<script>
  const ticker = document.getElementById('ticker');
  let on = false;
  window.setInterval(() => {
    on = !on;
    ticker.style.opacity = on ? '0.85' : '0.15';
  }, 60);
</script>
</body>
</html>
