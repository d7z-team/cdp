<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>fixture-scroll-actions-obscured</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
    }
    .hero {
      min-height: 130vh;
      border: 1px dashed #d0d7de;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 32px;
      color: #57606a;
    }
    .target-panel {
      position: relative;
      margin-top: 40px;
      margin-bottom: 120vh;
      padding: 24px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      background: #f6f8fa;
      max-width: 420px;
    }
    button {
      box-sizing: border-box;
      width: 100%;
      min-height: 48px;
      font: inherit;
    }
    .hover-blocker {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 24px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 87, 34, 0.92);
      color: #fff;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.01s linear;
    }
    .hover-blocker.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .state {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p>The button below reveals a blocker on hover after scrolling into view.</p>
    </section>

    <section class="target-panel" aria-label="hover obscured controls">
      <button type="button" data-testid="hover-obscured-button">hover-obscured-button</button>
      <div class="hover-blocker" data-testid="hover-blocker">hover-blocker</div>
      <div class="state" data-testid="hover-obscured-state">idle</div>
    </section>
  </main>

  <script>
    const button = document.querySelector('[data-testid="hover-obscured-button"]');
    const blocker = document.querySelector('[data-testid="hover-blocker"]');
    const state = document.querySelector('[data-testid="hover-obscured-state"]');

    button.addEventListener('mouseenter', () => {
      blocker.classList.add('visible');
      state.textContent = 'hovered';
    });

    button.addEventListener('click', () => {
      state.textContent = 'button-clicked';
    });

    blocker.addEventListener('click', () => {
      state.textContent = 'blocker-clicked';
    });
  </script>
</body>
</html>
