<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Content Read - Cross Origin IFrame</title>
</head>
<body>
  <h1>Cross Origin IFrame Test</h1>
  <p>Outer page content before iframes.</p>
  <iframe src="{{BASE_URL}}/content-read-iframe-inner" title="Same-origin iframe" style="width:100%;height:120px;border:1px solid #ccc;"></iframe>
  <iframe src="https://example.com" title="Cross-origin external iframe" style="width:100%;height:80px;border:1px solid #f00;"></iframe>
  <iframe src="data:text/html,<h2>Cross Origin Data</h2><p>Opaque origin content</p>" title="Cross-origin data iframe" style="width:100%;height:80px;border:1px solid #f00;"></iframe>
  <p>Outer page content after iframes.</p>
</body>
</html>
