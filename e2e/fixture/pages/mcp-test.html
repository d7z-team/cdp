<!doctype html>
<html>
<head><meta charset="utf-8"><title>MCP E2E Test Page</title>
<style>
  body { margin: 20px; font: 16px system-ui, sans-serif; }
  .banner { background: #1a73e8; color: white; padding: 48px 32px; text-align: center; font-size: 24px; }
  .section { margin: 32px 0; }
  .btn { padding: 10px 24px; margin: 4px; font-size: 16px; border: 2px solid #333; background: #eee; cursor: pointer; border-radius: 4px; }
  .btn-primary { background: #1a73e8; color: white; border-color: #1557b0; }
  input[type=text], textarea { padding: 8px; border: 2px solid #ccc; border-radius: 4px; font-size: 16px; width: 300px; display: block; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: 200px 200px; gap: 12px; }
  .card { border: 2px solid #ddd; padding: 16px; border-radius: 8px; text-align: center; }
  .scroll-area { height: 800px; background: linear-gradient(#e8f0fe, #fce8e6); padding: 20px; }
  .scroll-marker { padding: 4px; }
</style>
</head>
<body>
  <div class="banner">MCP E2E Test Page</div>

  <div class="section">
    <h2>Buttons</h2>
    <button class="btn btn-primary" id="btn-counter" data-testid="btn-counter">Clicked: 0</button>
    <button class="btn" id="btn-info" data-info="secret-42">Info</button>
    <div id="output"></div>
  </div>

  <div class="section">
    <h2>Text Input</h2>
    <input type="text" id="text-input" placeholder="Type here..." />
    <div id="text-mirror" style="margin-top:8px;color:#555"></div>
    <textarea id="textarea-input" placeholder="Multiline..." style="height:60px"></textarea>
  </div>

  <div class="section">
    <h2>Scroll Test</h2>
    <div class="scroll-area" id="scroll-container">
      <p class="scroll-marker">Scroll position: 0px</p>
      <p style="margin-top:600px">Bottom marker</p>
      <div id="scroll-indicator" style="background:red;color:white;padding:8px;display:none">Scroll detected!</div>
    </div>
  </div>

  <div class="section">
    <h2>Keyboard Test</h2>
    <div id="key-output" style="font-family:monospace;padding:8px;background:#f5f5f5;border-radius:4px">No keys pressed</div>
  </div>

  <script>
    // Button counter
    let count = 0;
    document.getElementById('btn-counter').addEventListener('click', function() {
      count++;
      this.textContent = 'Clicked: ' + count;
      document.getElementById('output').textContent = 'Last click: ' + new Date().toISOString();
    });

    // Text mirror
    document.getElementById('text-input').addEventListener('input', function() {
      document.getElementById('text-mirror').textContent = 'Mirror: ' + this.value;
    });

    // Scroll detection
    window.addEventListener('scroll', function() {
      var marker = document.querySelector('.scroll-marker');
      if (marker) marker.textContent = 'Scroll position: ' + window.scrollY + 'px';
    });

    // Keyboard detection
    document.addEventListener('keydown', function(e) {
      document.getElementById('key-output').textContent = 'Key: ' + e.key + ' (code: ' + e.code + ')' + (e.ctrlKey ? ' +Ctrl' : '') + (e.shiftKey ? ' +Shift' : '');
    });

    // Focus tracking for type_text test
    document.getElementById('text-input').addEventListener('focus', function() {
      document.getElementById('text-mirror').textContent = 'Focused';
    });
  </script>
</body>
</html>
