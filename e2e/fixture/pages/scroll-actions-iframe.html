<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>fixture-scroll-actions-iframe</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
    }
    .page-spacer {
      min-height: 125vh;
      border: 1px dashed #d0d7de;
      color: #57606a;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 32px;
    }
    .frame-wrap {
      margin-top: 40px;
      margin-bottom: 120vh;
      width: 560px;
      max-width: calc(100vw - 48px);
    }
    #scroll-frame {
      display: block;
      width: 100%;
      height: 260px;
      border: 2px solid #1f6feb;
      border-radius: 10px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="page-spacer">The iframe is below the outer page fold.</div>
  <div class="frame-wrap">
    <iframe id="scroll-frame" data-testid="scroll-frame" src="{{BASE_URL}}/scroll-actions-frame"></iframe>
  </div>
</body>
</html>
